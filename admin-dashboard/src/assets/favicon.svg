<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular White Background for definition -->
  <circle cx="60" cy="60" r="58" fill="#FFFFFF" />

  <!-- Outer Elegant Islamic Geometric Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8"/>

  <!-- Crescent Moon -->
  <path d="M 60 16 A 42 42 0 1 0 102 58 A 36 36 0 1 1 60 16 Z" fill="url(#emeraldGrad)" opacity="0.9"/>

  <!-- Eight-Pointed Islamic Star (Rub el Hizb) behind the book -->
  <g transform="translate(60, 48) scale(0.6)" opacity="0.85">
    <path d="M-15,-15 L0,-25 L15,-15 L25,0 L15,15 L0,25 L-15,15 L-25,0 Z" fill="url(#goldGrad)" />
    <path d="M-15,-15 L0,-25 L15,-15 L25,0 L15,15 L0,25 L-15,15 L-25,0 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Rehal (Quran Stand) -->
  <g transform="translate(60, 80)">
    <!-- Left Leg of stand -->
    <path d="M -16 -4 C -8 4, -4 14, -12 18 C -14 19, -16 19, -18 17 C -20 15, -16 5, -24 -2 Z" fill="url(#goldGrad)" />
    <!-- Right Leg of stand -->
    <path d="M 16 -4 C 8 4, 4 14, 12 18 C 14 19, 16 19, 18 17 C 20 15, 16 5, 24 -2 Z" fill="url(#goldGrad)" />
    <!-- Center hinge -->
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="#B45309" />
  </g>

  <!-- Holy Quran Book Pages -->
  <g transform="translate(60, 68)">
    <!-- Left Page Base/Thickness -->
    <path d="M 0 -2 C -10 -12, -22 -10, -28 -11 L -28 -7 C -22 -6, -10 -8, 0 2 Z" fill="#047857" />
    <!-- Right Page Base/Thickness -->
    <path d="M 0 -2 C 10 -12, 22 -10, 28 -11 L 28 -7 C 22 -6, 10 -8, 0 2 Z" fill="#047857" />

    <!-- Left Page (Open Book) -->
    <path d="M 0 -4 C -10 -14, -22 -12, -28 -13 L -28 -9 C -22 -8, -10 -10, 0 0 Z" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5" />
    <!-- Right Page (Open Book) -->
    <path d="M 0 -4 C 10 -14, 22 -12, 28 -13 L 28 -9 C 22 -8, 10 -10, 0 0 Z" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5" />

    <!-- Decorative Gold Borders on Pages -->
    <path d="M -4 -7 C -10 -12, -20 -10, -25 -11" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" />
    <path d="M 4 -7 C 10 -12, 20 -10, 25 -11" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" />

    <!-- Simulated Arabic Script lines -->
    <line x1="-8" y1="-8" x2="-22" y2="-10" stroke="#6B7280" stroke-width="0.75" stroke-dasharray="2 1" />
    <line x1="-6" y1="-5" x2="-20" y2="-7" stroke="#6B7280" stroke-width="0.75" stroke-dasharray="3 1" />
    <line x1="-8" y1="-2" x2="-18" y2="-4" stroke="#6B7280" stroke-width="0.75" stroke-dasharray="2 1" />

    <line x1="8" y1="-8" x2="22" y2="-10" stroke="#6B7280" stroke-width="0.75" stroke-dasharray="2 1" />
    <line x1="6" y1="-5" x2="20" y2="-7" stroke="#6B7280" stroke-width="0.75" stroke-dasharray="3 1" />
    <line x1="8" y1="-2" x2="18" y2="-4" stroke="#6B7280" stroke-width="0.75" stroke-dasharray="2 1" />
  </g>

  <!-- Glowing Star at Top Right -->
  <polygon points="86,22 88,27 93,27 89,30 91,35 86,32 81,35 83,30 79,27 84,27" fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>