worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # -----------------------------
    # User Facing App (Port 3000)
    # Serving under the /slqc sub-path
    # -----------------------------
    server {
        listen 3000;
        server_name localhost;

        # 1. Catch the specific sub-path
        location /slqc {
            # 2. Use 'alias' instead of 'root'
            alias /data/app;
            index index.html;

            # 3. SPA Fallback routed specifically to /slqc/index.html
            try_files $uri $uri/ /slqc/index.html;
        }

        # Optional: If someone hits the root of port 3000, redirect them to /slqc
        location = / {
            return 301 /slqc;
        }
    }

    # -----------------------------
    # Admin Dashboard (Port 3001)
    # Serving at the root
    # -----------------------------
    # -----------------------------
    # Admin Dashboard (Port 3001)
    # Serving under the /slqc-admin sub-path
    # -----------------------------
    server {
        listen 3001;
        server_name localhost;

        # 1. Catch the specific sub-path
        location /slqc-admin {
            # 2. Use 'alias' instead of 'root'
            alias /data/admin;
            index index.html;

            # 3. SPA Fallback routed specifically to the sub-path
            try_files $uri $uri/ /slqc-admin/index.html;
        }

        # Optional: Redirect root to /slqc-admin
        location = / {
            return 301 /slqc-admin;
        }
    }
}