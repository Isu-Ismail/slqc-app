<!DOCTYPE html>
<html lang="ta">

<head>
    <meta charset="utf-8">
    <title>Attendance Sheet - {{institution_name}}</title>
    <script>
        // ==========================================
        // CONFIGURABLE HEADINGS & LABELS (EDIT HERE)
        // ==========================================
        const CONFIG = {
            organizationTamil: "அல் ஜாமிஉல் அஸ்ஹர் ஜும்ஆ மஸ்ஜித், காயல்பட்டினம்.",
            madrasaTamil: "மத்ரஸத்துல் அஸ்ஹர் லி தஹ்ஃபீலில் குர்ஆனில் கரீம்",
            madrasaEnglish: "Madarasathul Azhar Li Thahfeezil Qur'anil Kareem",
            eventTamil: "மாநிலம் தழுவிய திருக்குர்ஆன் மனன திறனாய்வுப் போட்டி - 2026",
            eventEnglish: "QURAN HIFZ COMPETITION 2027",
            attendanceSheetTitle: "Attendance Sheet"
        };

        document.addEventListener("DOMContentLoaded", () => {
            Object.entries(CONFIG).forEach(([key, val]) => {
                const els = document.querySelectorAll(`[data-config="${key}"]`);
                els.forEach(el => {
                    el.textContent = val;
                });
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            color: #000;
            background: #fff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Force Landscape for Attendance Sheets */
        @page {
            size: A4 landscape;
            margin: 15mm;
        }

        @media print {
            .sheet {
                padding: 0 !important;
            }
        }

        .sheet {
            padding: 20px;
            max-width: 297mm;
            margin: 0 auto;
        }

        /* Flex layout for header information */
        .inst-info {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: left;
            border: 1px solid #000;
            padding: 10px 15px;
            background-color: #fafafa;
        }

        .inst-info-col {
            flex: 1;
        }

        .inst-info-col p {
            margin-bottom: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 6px 10px;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: #eee;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .sheet-footer {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .sig-block {
            text-align: center;
        }

        .sig-line {
            width: 240px;
            border-top: 1px solid #000;
            margin-top: 44px;
            padding-top: 6px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    {{sheets}}
</body>

</html>
